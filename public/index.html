<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phantom Bot — Dashboard</title>
<link rel="icon" href="data:," />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #1a1d21;
    padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 16px; margin-bottom: 20px;
    border-bottom: 1px solid #e0e2e6;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .conn { font-size: 13px; color: #777; display: flex; align-items: center; gap: 6px; }
  header .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0a100; }
  header .conn.live { color: #2e7d32; }
  header .conn.live .dot { background: #2e9e44; }
  header .conn.down { color: #c62828; }
  header .conn.down .dot { background: #c62828; }
  header .conn span.tag {
    margin-left: 8px; padding: 2px 8px; font-size: 11px; color: #555;
    border: 1px solid #d0d3d8; border-radius: 4px;
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .card {
    background: #fff; border: 1px solid #e0e2e6; border-radius: 8px; padding: 14px 16px;
  }
  .card .k { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .card .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .v.green { color: #2e9e44; }
  .card .v.red { color: #d32f2f; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }

  .card h2 { font-size: 13px; font-weight: 600; margin-bottom: 12px; color: #444; }

  .pos-flat { color: #999; font-size: 14px; padding: 8px 0; }
  .pos-line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
  .pos-line .k { color: #777; }
  .pos-line .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos-line .v.up { color: #2e9e44; }
  .pos-line .v.down { color: #d32f2f; }

  .book { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .side { border: 1px solid #e0e2e6; border-radius: 6px; padding: 10px 12px; }
  .side .st { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 6px; }
  .side .px { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .side .px.yes { color: #1565c0; }
  .side .px.no { color: #2e7d32; }
  .side .ln { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 4px; }

  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #eef0f2; }
  th { font-weight: 600; color: #666; background: #fafbfc; font-size: 12px; }
  td { font-variant-numeric: tabular-nums; }
  .pnl.green { color: #2e9e44; }
  .pnl.red { color: #d32f2f; }
  .empty { padding: 24px; text-align: center; color: #999; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Phantom Bot</h1>
      <div class="conn" id="connbox">
        <span class="dot"></span><span id="conntext">Connecting…</span>
        <span class="tag" id="chip-mode">SIM</span>
        <span class="tag" id="chip-clients">0 clients</span>
      </div>
    </header>

    <div class="stats">
      <div class="card"><div class="k">Balance</div><div class="v" id="balance">—</div></div>
      <div class="card"><div class="k">Win Rate</div><div class="v" id="winrate">—</div></div>
      <div class="card"><div class="k">Trades</div><div class="v" id="total">—</div></div>
      <div class="card"><div class="k">W / L</div><div class="v" id="wl">—</div></div>
    </div>

    <div class="row">
      <div class="card">
        <h2>Position</h2>
        <div id="pos-body"><div class="pos-flat">No open position</div></div>
      </div>

      <div class="card">
        <h2>Market</h2>
        <div class="book">
          <div class="side">
            <div class="st">YES</div>
            <div class="px yes" id="yes-ask">—</div>
            <div class="ln"><span>Bid</span><span id="yes-bid">—</span></div>
          </div>
          <div class="side">
            <div class="st">NO</div>
            <div class="px no" id="no-ask">—</div>
            <div class="ln"><span>Bid</span><span id="no-bid">—</span></div>
          </div>
        </div>
        <div class="ln" style="margin-top:10px">
          <span>Mid</span><span id="mid">—</span>
          <span>Spread</span><span id="spread">—</span>
          <span>Market</span><span id="market">—</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Recent Trades</h2>
      <div id="ledger-wrap"></div>
    </div>
  </div>

<script>
(() => {
  const WS_URL = 'wss://phantom-3nye.onrender.com';
  const $ = (id) => document.getElementById(id);
  const money = (x) => (x == null ? '—' : (x < 0 ? '-' : '') + '$' + Math.abs(x).toFixed(2));
  const price = (x) => (x == null ? '—' : Number(x).toFixed(4));
  const dur = (ms) => {
    if (ms == null) return '—';
    const s = Math.max(0, Math.round(ms / 1000));
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(s / 60)) + ':' + p(s % 60);
  };
  const time = (t) => new Date(t).toLocaleTimeString('en-GB', { hour12: false });

  function wsUrl() {
    const h = location.hostname;
    if (h === 'localhost' || h === '127.0.0.1') return 'ws://' + location.host + '/';
    if (h.includes('onrender.com')) return 'wss://' + location.host + '/';
    return WS_URL;
  }

  let state = null, ws = null, delay = 500;
  const setConn = (cls, txt) => { $('connbox').className = 'conn ' + cls; $('conntext').textContent = txt; };

  function connect() {
    setConn('', 'Connecting…');
    try { ws = new WebSocket(wsUrl()); } catch (e) { return setTimeout(connect, delay); }
    ws.onopen = () => { setConn('live', 'Live'); delay = 500; };
    ws.onclose = () => { setConn('down', 'Reconnecting…'); setTimeout(connect, delay); delay = Math.min(delay * 2, 15000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'state') { state = m; render(); }
      } catch (e) {}
    };
  }

  function render() {
    if (!state) return;
    const s = state, st = s.status || {}, q = s.quote;

    $('chip-mode').textContent = (s.mode || '—').toUpperCase() + (q && q.simulated ? ' (SIM)' : '');
    $('chip-clients').textContent = (s.wsClients ?? 0) + ' clients';

    $('balance').textContent = money(st.balance ?? s.balance);
    const wr = st.winRate;
    $('winrate').textContent = wr == null ? '—' : wr.toFixed(1) + '%';
    $('total').textContent = st.totalTrades ?? '—';
    $('wl').textContent = (st.wins ?? 0) + ' / ' + (st.losses ?? 0);

    if (q) {
      $('yes-ask').textContent = price(q.yesAsk);
      $('yes-bid').textContent = price(q.yesBid);
      $('no-ask').textContent = price(q.noAsk);
      $('no-bid').textContent = price(q.noBid);
      $('mid').textContent = price(q.mid);
      $('spread').textContent = (q.yesAsk - q.yesBid).toFixed(4);
      $('market').textContent = q.marketId;
    }

    const p = st.openPosition;
    const body = $('pos-body');
    if (p) {
      const bid = p.direction === 'UP' ? (q && q.yesBid) : (q && q.noBid);
      const pnl = p.tokensBought * (bid || p.entryPrice) - p.stake;
      const remain = Math.max(0, p.windowEnd - Date.now());
      body.innerHTML =
        '<div class="pos-line"><span class="k">Direction</span><span class="v ' + (p.direction === 'UP' ? 'up' : 'down') + '">' + p.direction + '</span></div>' +
        '<div class="pos-line"><span class="k">Entry</span><span class="v">' + price(p.entryPrice) + '</span></div>' +
        '<div class="pos-line"><span class="k">Current Bid</span><span class="v">' + price(bid) + '</span></div>' +
        '<div class="pos-line"><span class="k">Live PnL</span><span class="v ' + (pnl >= 0 ? 'up' : 'down') + '">' + money(pnl) + '</span></div>' +
        '<div class="pos-line"><span class="k">Multiplier</span><span class="v">' + Number(p.trueMultiplier).toFixed(2) + 'x</span></div>' +
        '<div class="pos-line"><span class="k">Closes in</span><span class="v">' + dur(remain) + '</span></div>';
    } else {
      body.innerHTML = '<div class="pos-flat">No open position' + (st.nextWindowStart ? ' — next window in ' + dur(st.nextWindowStart - Date.now()) : '') + '</div>';
    }

    renderLedger(s.recentTrades || []);
  }

  function renderLedger(trades) {
    const wrap = $('ledger-wrap');
    if (!trades.length) {
      wrap.innerHTML = '<div class="empty">No trades yet.</div>';
      return;
    }
    wrap.innerHTML =
      '<table><thead><tr><th>Time</th><th>Direction</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Reason</th><th>Duration</th></tr></thead><tbody>' +
      trades.slice(0, 50).map((t) =>
        '<tr>' +
          '<td>' + time(t.closedAt) + '</td>' +
          '<td>' + t.direction + '</td>' +
          '<td>' + price(t.entryPrice) + '</td>' +
          '<td>' + price(t.exitPrice) + '</td>' +
          '<td class="pnl ' + (t.pnl >= 0 ? 'green' : 'red') + '">' + money(t.pnl) + '</td>' +
          '<td>' + t.reason + '</td>' +
          '<td>' + dur(t.durationMs) + '</td>' +
        '</tr>'
      ).join('') +
      '</tbody></table>';
  }

  setInterval(() => {
    if (state && state.status && state.status.openPosition) {
      const p = state.status.openPosition;
      const remain = Math.max(0, p.windowEnd - Date.now());
      const line = [...document.querySelectorAll('#pos-body .pos-line')].find((l) => l.textContent.includes('Closes in'));
      if (line) line.querySelector('.v').textContent = dur(remain);
    }
  }, 1000);

  connect();
})();
</script>
</body>
</html>
